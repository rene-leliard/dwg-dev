# Caddy est devant ce nginx (en-tête Via) et transmet les en-têtes de réponse.
# Pour retirer aussi le nom « nginx », dans le bloc du site Caddy :
#   header {
#       -Server
#   }
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    server_tokens off;

    # Fichiers statiques. Les réponses PHP passent par location ~ \.php$,
    # qui n'hérite pas de ces add_header : Symfony les pose, sans doublon.
    location / {
        try_files $uri /index.php$is_args$args;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
